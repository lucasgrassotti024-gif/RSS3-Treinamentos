<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rss3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cap_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados no tom Azul Escuro Institucional -->
  <rect width="64" height="64" rx="16" fill="url(#rss3_bg)" />

  <!-- Borda sutil de destaque -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Capelo de Formatura / Graduação em Laranja Vibrante RSS3 -->
  <!-- Topo do Capelo (Losango) -->
  <polygon points="32,16 52,25 32,34 12,25" fill="url(#cap_grad)" />

  <!-- Base do Capelo -->
  <path d="M20,29.5 L20,38 C20,43 44,43 44,38 L44,29.5" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />

  <!-- Tassel / Cordão com Pingente -->
  <path d="M48,27 L50,37 C50,39 47,40 47,40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="47" cy="40" r="1.5" fill="#f97316" />

  <!-- Texto RSS3 na base do ícone -->
  <text x="32" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    RSS3
  </text>
</svg>
